# Temporary HTTP-only block for installing the Let's Encrypt certificate.
# Use only after both domain names resolve to this VM or route to it.
server {
    listen 80;
    listen [::]:80;
    server_name bettermiagao.org www.bettermiagao.org;
    root /var/www/bettermiagao.org;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
