# Install only after the bettermiagao.org certificate exists.
# Static build root: /var/www/bettermiagao.org
server {
    listen 80;
    listen [::]:80;
    server_name bettermiagao.org www.bettermiagao.org;
    root /var/www/bettermiagao.org;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bettermiagao.org www.bettermiagao.org;
    root /var/www/bettermiagao.org;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bettermiagao.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettermiagao.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
